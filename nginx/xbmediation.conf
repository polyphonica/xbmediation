# Server block for the host's own nginx (installed as a system package,
# alongside the other apps on this VPS) — this is NOT run inside Docker.
# Copy/symlink this into your nginx sites-available and enable it:
#
#   sudo cp nginx/xbmediation.conf /etc/nginx/sites-available/xbmediation
#   sudo ln -s /etc/nginx/sites-available/xbmediation /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Proxies to the "app" container's port, published to loopback only via
# docker-compose.yml's `127.0.0.1:${APP_PORT:-3000}:3000` mapping — adjust
# the port below if you set APP_PORT to something other than 3000.
#
# BEFORE A DOMAIN EXISTS: this config serves plain HTTP only (no server_name,
# so it's nginx's default site — remove/rename any other default_server
# block first to avoid a conflict). Once the domain is registered:
#   1. replace `listen 80 default_server;` with `listen 80;` and add
#      `server_name xb-mediation.de www.xb-mediation.de;`
#   2. run `sudo certbot --nginx -d xb-mediation.de -d www.xb-mediation.de`
#      (certbot rewrites this file to add the HTTPS server block and the
#      HTTP->HTTPS redirect automatically)

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # server_name xb-mediation.de www.xb-mediation.de;  # uncomment once registered

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
