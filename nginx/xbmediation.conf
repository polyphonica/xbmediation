# Server block for the host's own nginx (installed as a system package,
# alongside the other apps on this VPS). Copy/symlink this into
# sites-available and enable it:
#
#   sudo cp nginx/xbmediation.conf /etc/nginx/sites-available/xbmediation
#   sudo ln -s /etc/nginx/sites-available/xbmediation /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Proxies to the Next.js app run natively via systemd (see
# deploy/xbmediation.service), listening on localhost:3000 by default
# (`next start`'s default port) — adjust the port below if you changed it.
#
# Domain is registered (xb-mediation.de) and DNS points at this VPS — this
# config currently serves plain HTTP. Add HTTPS with:
#   sudo certbot --nginx -d xb-mediation.de -d www.xb-mediation.de
# (certbot rewrites this file to add the HTTPS server block and the
# HTTP->HTTPS redirect automatically).

server {
    listen 80;
    listen [::]:80;

    server_name xb-mediation.de www.xb-mediation.de;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
