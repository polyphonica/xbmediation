# Server block for the host's own nginx (installed as a system package,
# alongside the other apps on this VPS). Copy/symlink this into
# sites-available and enable it:
#
#   sudo cp nginx/xbmediation.conf /etc/nginx/sites-available/xbmediation
#   sudo ln -s /etc/nginx/sites-available/xbmediation /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Proxies to the Next.js app run natively via systemd (see
# deploy/xbmediation.service), listening on localhost:3000 by default
# (`next start`'s default port) — adjust the port below if you changed it.
#
# NOTE: this file is the base template. On the live server, certbot has
# already rewritten /etc/nginx/sites-available/xbmediation to add the HTTPS
# server block (listen 443 ssl) and an HTTP->HTTPS redirect on port 80 — the
# /admin location below needs to be added to THAT server block (the 443
# one), not necessarily to this file's plain-HTTP block. See README.md.
#
# /admin is protected with HTTP Basic Auth. Create the password file once:
#   sudo apt install -y apache2-utils   # provides htpasswd, if not present
#   sudo htpasswd -c /etc/nginx/.htpasswd <username>

server {
    listen 80;
    listen [::]:80;

    server_name xb-mediation.de www.xb-mediation.de;

    location /admin {
        auth_basic "XB Mediation Admin";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
