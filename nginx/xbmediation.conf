# Server block for the host's own nginx (installed as a system package,
# alongside the other apps on this VPS). Copy/symlink this into
# sites-available and enable it:
#
#   sudo cp nginx/xbmediation.conf /etc/nginx/sites-available/xbmediation
#   sudo ln -s /etc/nginx/sites-available/xbmediation /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Proxies to the Next.js app run natively via systemd (see
# deploy/xbmediation.service), listening on localhost:3000 by default
# (`next start`'s default port) — adjust the port below if you changed it.
#
# /admin has its own application-level login (see src/app/admin/) — nginx
# doesn't need to (and no longer does) gate it with Basic Auth.
#
# NOTE: this file is the base template. On the live server, certbot has
# already rewritten /etc/nginx/sites-available/xbmediation to add the HTTPS
# server block (listen 443 ssl) and an HTTP->HTTPS redirect on port 80.

server {
    listen 80;
    listen [::]:80;

    server_name xb-mediation.de www.xb-mediation.de;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
