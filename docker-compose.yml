services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://xbmediation:${POSTGRES_PASSWORD}@db:5432/xbmediation
      NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost}
    ports:
      # Bound to loopback only — the host's own nginx (not this compose
      # stack) terminates TLS and proxies to this port. Never publish this
      # on a public interface. Set APP_PORT if 3000 collides with another
      # app already running on the server.
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      - db

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: xbmediation
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: xbmediation
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Intentionally no `ports:` mapping — only the `app` service can reach
    # Postgres, over the internal Docker network. Never bind this publicly.

volumes:
  pgdata:
