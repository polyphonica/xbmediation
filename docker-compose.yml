services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://xbmediation:${POSTGRES_PASSWORD}@db:5432/xbmediation
      NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost}
    depends_on:
      - db

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: xbmediation
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: xbmediation
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Intentionally no `ports:` mapping — only the `app` service can reach
    # Postgres, over the internal Docker network. Never bind this publicly.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
